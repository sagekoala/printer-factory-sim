[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printer-factory-sim"
version = "0.2.0"
description = "Three-app FastAPI simulation of a 3D-printer supply chain (provider + manufacturer + retailer) with an LLM-agent turn engine."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]
dev = [
  "ruff>=0.4",
  "mypy>=1.9",
]

[project.scripts]
manufacturer-cli = "manufacturer.cli:main"
provider-cli = "provider.cli:main"
retailer-cli = "retailer.cli:main"

[tool.setuptools]
packages = ["manufacturer", "manufacturer.services", "provider", "provider.services", "retailer"]
py-modules = ["turn_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
